name: Build Executables for Windows and macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: MusicAgent.exe
            artifact_name: MusicAgent-Windows
          - os: macos-latest
            asset_name: MusicAgent
            artifact_name: MusicAgent-macOS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: python build.py

      - name: Test Executable Help Output (Windows)
        if: matrix.os == 'windows-latest'
        run: .\MusicAgent.exe --help

      - name: Test Executable Help Output (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x ./MusicAgent
          ./MusicAgent --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Release Binaries
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: MusicAgent-Windows

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: MusicAgent-macOS

      - name: Display Downloaded Files
        run: ls -la

      - name: Create ZIP Archives
        run: |
          zip MusicAgent-Windows.zip MusicAgent.exe
          zip MusicAgent-macOS.zip MusicAgent

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: |
            ### 🎵 Music Agent Standalone Releases

            #### 🪟 Windows Users
            1. Download **`MusicAgent-Windows.zip`** below and extract it.
            2. Double-click **`MusicAgent.exe`** to launch the GUI.
            3. Ensure `ffmpeg` is installed (`winget install ffmpeg`).

            #### 🍏 macOS Users
            1. Download **`MusicAgent-macOS.zip`** below and unzip it (`MusicAgent`).
            2. Open Terminal in your Downloads folder:
               ```bash
               cd ~/Downloads
               chmod +x MusicAgent
               ./MusicAgent
               ```
            3. If macOS blocks execution: Go to **System Settings > Privacy & Security** and click **Open Anyway**, or run:
               ```bash
               xattr -d com.apple.quarantine MusicAgent
               ```
            
            *Note: `ffmpeg` is required on system PATH for MP3 audio conversion.*
          files: |
            MusicAgent-Windows.zip
            MusicAgent-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
